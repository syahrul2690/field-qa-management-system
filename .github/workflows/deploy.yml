name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # First-time clone if directory doesn't exist
            if [ ! -d ~/field-qa-management-system ]; then
              cd ~
              git clone git@github.com:syahrul2690/field-qa-management-system.git field-qa-management-system
            fi
            cd ~/field-qa-management-system
            git pull origin main
            docker compose -f docker-compose.prod.yml build --no-cache backend frontend
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
