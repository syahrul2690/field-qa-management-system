name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild both images'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: syahrul2690/field-qa-management-system

jobs:
  detect-changes:
    name: Detect Changed Workspaces
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.result.outputs.backend }}
      frontend: ${{ steps.result.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'prisma/**'
              - 'package*.json'
              - 'backend/Dockerfile'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'package*.json'
              - 'frontend/Dockerfile'
      - name: Resolve build targets
        id: result
        run: |
          FORCE="${{ github.event.inputs.force_build }}"
          BACKEND="${{ steps.changes.outputs.backend }}"
          FRONTEND="${{ steps.changes.outputs.frontend }}"
          # Force rebuild, or rebuild both when neither workspace changed (first deploy)
          if [ "$FORCE" = "true" ] || ( [ "$BACKEND" != "true" ] && [ "$FRONTEND" != "true" ] ); then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=$BACKEND" >> $GITHUB_OUTPUT
            echo "frontend=$FRONTEND" >> $GITHUB_OUTPUT
          fi

  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always() && !failure() && !cancelled()
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 300s
          script: |
            set -e

            # Ensure deploy key and SSH config alias are present on this VPS
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            if [ ! -f ~/.ssh/field_qa_deploy ]; then
              echo "${{ secrets.GH_DEPLOY_KEY }}" > ~/.ssh/field_qa_deploy
              chmod 600 ~/.ssh/field_qa_deploy
            fi
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            if ! grep -q "Host github-field-qa" ~/.ssh/config 2>/dev/null; then
              printf '\nHost github-field-qa\n  HostName github.com\n  User git\n  IdentityFile ~/.ssh/field_qa_deploy\n  StrictHostKeyChecking no\n' >> ~/.ssh/config
              chmod 600 ~/.ssh/config
            fi

            # Clone repo on first run
            if [ ! -d ~/field-qa-management-system ]; then
              cd ~
              git clone git@github-field-qa:syahrul2690/field-qa-management-system.git field-qa-management-system
            fi

            cd ~/field-qa-management-system
            git pull origin main

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            echo "=== Deploy complete ==="
            docker ps --filter name=qa-
