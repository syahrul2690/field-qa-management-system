name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    # scopedRepo.integration.test.ts proves the chat tools cannot read across
    # institution boundaries against a real database, so the CI job runs a
    # disposable Postgres. The test creates its own fixture rows, so only the
    # migrations need to be applied before the test phase.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa_user
          POSTGRES_PASSWORD: qa_password
          POSTGRES_DB: field_qa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_user -d field_qa_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://qa_user:qa_password@localhost:5432/field_qa_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=shared

      - name: Generate Prisma Client
        run: npm run generate --workspace=backend

      - name: Type-check backend
        run: npm run build --workspace=backend

      - name: Type-check frontend
        run: npm run build --workspace=frontend

      - name: Run backend migrations
        run: npm run migrate:deploy --workspace=backend

      - name: Run backend tests
        run: npm run test:ci --workspace=backend

      - name: Run frontend tests
        run: npm run test:ci --workspace=frontend

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: lint-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: false
          tags: qa-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: false
          tags: qa-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
